services:
  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: propertycore-esphome
    restart: unless-stopped
    ports:
      - "6052:6052"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Africa/Lagos
    command: ["dashboard", "/config", "--port", "6052"]
